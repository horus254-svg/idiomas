<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Aprende idiomas</title>
<style>
:root{--bg:#f6f4ef;--surface:#fff;--surface2:#f1eee8;--text:#1d1b18;--muted:#6f6b63;--line:#e6e2d9;--shadow:0 1px 2px rgba(20,16,10,.06),0 8px 22px rgba(20,16,10,.06)}
body.dark{--bg:#0e0e10;--surface:#17171a;--surface2:#222226;--text:#f3f1ec;--muted:#9d9a92;--line:#2c2c31;--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;transition:background .25s,color .25s}
.wrap{max-width:900px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px 60px}
.top{display:flex;justify-content:flex-end;gap:8px}
.tt{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;cursor:pointer;color:var(--text)}
header{text-align:center;margin:6px 0 24px}
h1{font-size:clamp(2rem,7vw,3rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 10px}
h1 em{font-style:normal;background:linear-gradient(90deg,#e11d3e,#be185d,#4f46e5,#0e7490,#15803d);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);max-width:500px;margin:0 auto;font-size:1rem}
.summary{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:.88rem;color:var(--muted)}
.pill b{color:var(--text)}
.install{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.install img{width:44px;height:44px;border-radius:12px}
.install div{flex:1;font-size:.92rem}
.install b{display:block;font-size:1rem}
.ibtn{border:0;background:#4f46e5;color:#fff;font-weight:800;border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:800}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{--c:#e11d3e;position:relative;display:block;text-decoration:none;color:inherit;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 13%,var(--surface)),var(--surface) 65%);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:var(--c)}
.row{display:flex;align-items:center;gap:14px}
.flag{font-size:2.3rem;line-height:1}
.nm{font-weight:800;font-size:1.15rem}
.nat{color:var(--c);font-weight:700;font-size:1.05rem;margin-top:1px}
.cjk{font-family:"Noto Serif CJK SC","Noto Serif CJK JP","Noto Serif CJK KR","Songti SC","Hiragino Mincho ProN",serif}
.desc{color:var(--muted);font-size:.9rem;margin:12px 0 14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .6s}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:.82rem;color:var(--muted)}
.go{font-weight:800;color:var(--c);white-space:nowrap}
.tag{position:absolute;top:14px;right:14px;background:var(--c);color:#fff;font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.due{color:var(--c);font-weight:800}
.foot{text-align:center;color:var(--muted);font-size:.82rem;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="tt" id="tt" aria-label="Cambiar tema">🌙</button></div>
  <header>
    <h1>Aprende <em>idiomas</em><br>a tu ritmo</h1>
    <p class="sub">Lecciones cortas, repaso inteligente y audio en cada palabra. Gratis y sin cuentas: tu progreso se guarda en este dispositivo.</p>
    <div class="summary" id="summary"></div>
  </header>
  <div class="install" id="installBox" hidden>
    <img src="icon-192.png" alt="">
    <div><b>Instálala en tu teléfono</b><span id="installTxt">Ábrela como una app, incluso sin internet.</span></div>
    <button class="ibtn" id="installBtn" hidden>Instalar</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="foot">Funciona mejor en Chrome o Edge · el micrófono necesita https://</p>
</div>
<script>
const LANGS = [
  {code:'zh',n:'Chino',nat:'中文',f:'🇨🇳',key:'chinese-plan',c:'#e11d3e',cjk:1,d:'Tonos, caracteres y frases del día a día.'},
  {code:'en',n:'Inglés',nat:'English',f:'🇬🇧',key:'english-plan',c:'#2563eb',d:'Pronunciación guiada y conversación real.'},
  {code:'pt',n:'Portugués',nat:'Português',f:'🇧🇷',key:'portuguese-plan',c:'#15803d',d:'Portugués de Brasil, claro y práctico.'},
  {code:'ko',n:'Coreano',nat:'한국어',f:'🇰🇷',key:'korean-plan',c:'#4f46e5',cjk:1,d:'Hangul, romanización y frases útiles.'},
  {code:'ru',n:'Ruso',nat:'Русский',f:'🇷🇺',key:'russian-plan',c:'#0e7490',d:'Cirílico con transliteración y audio.'},
  {code:'ja',n:'Japonés',nat:'日本語',f:'🇯🇵',key:'japanese-plan',c:'#be185d',cjk:1,d:'Kana, kanji y frases con romaji.'},
  {code:'it',n:'Italiano',nat:'Italiano',f:'🇮🇹',key:'italian-plan',c:'#b45309',d:'Pronunciación, vocabulario y frases cotidianas.'},
  {code:'fr',n:'Francés',nat:'Français',f:'🇫🇷',key:'french-plan',c:'#1d4ed8',d:'Pronunciación, vocabulario y frases cotidianas.'}
];
const TOTAL = 793;
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function getJSON(k){try{return JSON.parse(get(k)||'null')}catch(e){return null}}
function day(o){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

let totalLearned = 0, totalDue = 0, bestStreak = 0, recent = null, recentDate = '';
const today = day(0);
const info = LANGS.map(L => {
  let learned = 0, due = 0, streak = 0, last = '';
  const srs = getJSON(L.key + '-srs-v1');
  if(srs){ for(const id in srs){ learned++; if(srs[id].d <= today) due++; } }
  else { const old = getJSON(L.key + '-progress-v1'); if(old) for(const k in old) if(k[0]==='a' && old[k] > 0) learned++; }
  const s = getJSON(L.key + '-streak');
  if(s){ last = s.lastDate || ''; if(last === day(0) || last === day(1)) streak = s.count; }
  totalLearned += learned; totalDue += due; bestStreak = Math.max(bestStreak, streak);
  if(last && last > recentDate){ recentDate = last; recent = L.code; }
  return {learned, due, streak};
});

const grid = document.getElementById('grid');
LANGS.forEach((L, i) => {
  const {learned, due, streak} = info[i], pct = Math.min(100, Math.round(learned / TOTAL * 100));
  const a = document.createElement('a');
  a.className = 'card'; a.href = 'app.html?lang=' + L.code; a.style.setProperty('--c', L.c);
  a.innerHTML = `${recent === L.code ? '<span class="tag">Continuar</span>' : ''}
    <div class="row"><div class="flag">${L.f}</div><div><div class="nm">${L.n}</div><div class="nat ${L.cjk ? 'cjk' : ''}">${L.nat}</div></div></div>
    <p class="desc">${L.d}</p>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>${learned ? learned + ' aprendidas' : TOTAL + ' palabras y frases'}${due ? ` · <span class="due">${due} por repasar</span>` : ''}${streak ? ' · 🔥 ' + streak : ''}</span><span class="go">${learned ? 'Seguir →' : 'Empezar →'}</span></div>`;
  grid.appendChild(a);
});
document.getElementById('summary').innerHTML = `<span class="pill"><b>${LANGS.length}</b> idiomas</span><span class="pill"><b>${totalLearned}</b> palabras aprendidas</span>`
  + (totalDue ? `<span class="pill"><b>${totalDue}</b> repasos hoy</span>` : '') + (bestStreak ? `<span class="pill">🔥 <b>${bestStreak}</b> días de racha</span>` : '');

const tt = document.getElementById('tt');
function setDark(d){document.body.classList.toggle('dark', d); tt.textContent = d ? '☀️' : '🌙'; try{localStorage.setItem('langapp-theme', d ? 'dark' : 'light')}catch(e){}
  document.querySelector('meta[name=theme-color]').setAttribute('content', d ? '#0e0e10' : '#f6f4ef');}
const saved = get('langapp-theme') || get('hub-theme');
setDark(saved ? saved === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
tt.onclick = () => setDark(!document.body.classList.contains('dark'));

// Offline + install
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
const box = document.getElementById('installBox'), ib = document.getElementById('installBtn');
let deferred = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; box.hidden = false; ib.hidden = false; });
ib.onclick = async () => { if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; box.hidden = true; };
if(!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)){
  box.hidden = false;
  document.getElementById('installTxt').textContent = 'En Safari toca Compartir ⬆️ y luego “Agregar a inicio”.';
}
</script>
</body>
</html>
