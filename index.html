<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e11d3e">
<meta name="description" content="Planes de un año para aprender 9 idiomas desde el español: pronunciación, micrófono, repaso espaciado y seguimiento de progreso.">
<title>Idiomas — elige el tuyo</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23e11d3e%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22%3EA%3C/text%3E%3C/svg%3E">
</head>
<body>
<script>try{var t=localStorage.getItem('idiomas-theme')||localStorage.getItem('lang-hub-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.body.classList.add('dark');}catch(e){}</script>
<div class="wrap" style="max-width:760px">
  <header class="hub-head">
    <div class="hub-top"><button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">🌙</button></div>
    <h1>¿Qué idioma quieres aprender?</h1>
    <div class="sub">Planes de un año con pronunciación, micrófono, repaso diario y seguimiento de tu progreso.</div>
  </header>

  <div class="today-card" id="today"></div>
  <div class="lang-grid" id="grid"></div>

  <div class="backup-row">
    <button class="btn" id="exportBtn">⬇️ Descargar copia de mi progreso</button>
    <button class="btn" id="importBtn">⬆️ Restaurar copia</button>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </div>
  <div class="footer-note">Cada idioma guarda su progreso por separado en este navegador.<br>Usa la copia de seguridad para pasarlo a otro dispositivo o no perderlo si borras los datos del navegador.</div>
</div>

<script src="assets/catalog.js"></script>
<script>
(function(){
  const C = window.CATALOG;
  const get = (k, d) => { try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } };
  const raw = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dstr = d => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const today = dstr(), yest = dstr(new Date(Date.now() - 86400000));

  function info(L){
    const prog = get(L.storagePrefix + '-progress-v1', {}) || {};
    const srs = get(L.storagePrefix + '-srs', {}) || {};
    const st = get(L.storagePrefix + '-streak', null);
    const log = get(L.storagePrefix + '-log', {}) || {};
    const mastered = Object.keys(prog).filter(k => k.startsWith('a-') && prog[k] >= 3).length;
    const started = Object.keys(prog).some(k => prog[k]);
    const due = Object.values(srs).filter(c => c && c.due <= today).length;
    const streak = st && st.lastDate && st.lastDate >= yest ? st.count : 0;
    return {mastered, started, due, streak, xp: log[today] || 0};
  }

  function render(){
    const last = raw('idiomas-last');
    const infos = C.map(L => Object.assign({L}, info(L)));
    const xp = infos.reduce((s, x) => s + x.xp, 0);
    const best = Math.max(0, ...infos.map(x => x.streak));
    const lastL = C.find(L => L.code === last);
    const lastI = lastL && infos.find(x => x.L === lastL);
    document.getElementById('today').innerHTML = `
      <div><div class="big">🔥 ${best}</div><div class="muted" style="font-size:12.5px">${best === 1 ? 'día' : 'días'} de racha</div></div>
      <div><div class="big">${xp}</div><div class="muted" style="font-size:12.5px">XP hoy</div></div>
      ${lastL ? `<a class="btn main cont" href="${lastL.page}">${lastL.flag} Continuar con ${esc(lastL.name)}${lastI.due ? ' · ' + lastI.due + ' por repasar' : ''} →</a>`
              : `<div class="cont muted" style="font-size:13.5px">Elige un idioma para empezar 👇</div>`}`;
    document.getElementById('grid').innerHTML = infos.map(x => {
      const L = x.L, pct = Math.round(x.mastered / L.total * 100);
      return `<a class="lang-card" href="${L.page}">
        ${L.code === last ? '<span class="badge-last">ÚLTIMO</span>' : L.isNew && !x.started ? '<span class="badge-new">NUEVO</span>' : ''}
        <div class="flag">${L.flag}</div>
        <div class="name">${esc(L.name)}</div>
        <div class="native">${esc(L.hero)}</div>
        <div class="desc">${esc(L.desc.replace(/^Nuevo · /, ''))}</div>
        ${x.started ? `<div class="mini-bar"><div style="width:${pct}%"></div></div>
          <div class="meta"><span>${x.mastered}/${L.total} dominadas</span><span>${x.streak ? '🔥 ' + x.streak : ''}${x.due ? ' · 🔁 ' + x.due : ''}</span></div>`
          : `<div class="meta"><span>${L.total} frases y palabras</span></div>`}
        <div class="go">${x.started ? 'Continuar →' : 'Empezar →'}</div>
      </a>`;
    }).join('');
  }

  // Tema
  const tb = document.getElementById('themeBtn');
  const syncIcon = () => tb.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  tb.onclick = () => { const d = document.body.classList.toggle('dark'); try{ localStorage.setItem('idiomas-theme', d ? 'dark' : 'light'); }catch(e){} syncIcon(); };
  syncIcon();

  // Copia de seguridad
  const prefixes = C.map(L => L.storagePrefix + '-').concat(['idiomas-', 'lang-hub-']);
  document.getElementById('exportBtn').onclick = () => {
    const data = {};
    try{ for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (prefixes.some(p => k.startsWith(p))) data[k] = localStorage.getItem(k); } }catch(e){}
    const blob = new Blob([JSON.stringify({app: 'idiomas', version: 2, date: new Date().toISOString(), data}, null, 1)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'idiomas-progreso-' + today + '.json';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  const fileIn = document.getElementById('importFile');
  document.getElementById('importBtn').onclick = () => fileIn.click();
  fileIn.onchange = () => {
    const f = fileIn.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const j = JSON.parse(r.result);
        if (!j || j.app !== 'idiomas' || !j.data) throw new Error('formato');
        let n = 0;
        Object.keys(j.data).forEach(k => { if (prefixes.some(p => k.startsWith(p))){ localStorage.setItem(k, j.data[k]); n++; } });
        render(); alertBox('✓ Copia restaurada (' + n + ' elementos).');
      }catch(e){ alertBox('Ese archivo no parece una copia de esta app.'); }
      fileIn.value = '';
    };
    r.readAsText(f);
  };
  function alertBox(msg){
    let host = document.querySelector('.toast-host');
    if (!host){ host = document.createElement('div'); host.className = 'toast-host'; document.body.appendChild(host); }
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; host.appendChild(t); setTimeout(() => t.remove(), 3500);
  }

  render();
  window.addEventListener('pageshow', render);
})();
</script>
</body>
</html>
