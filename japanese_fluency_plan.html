<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#be185d">
<title>日本語を学ぶ — Plan de un año</title>
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#f1eee8; --text:#1d1b18; --muted:#6f6b63; --line:#e6e2d9;
  --accent:#be185d; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --shadow:0 1px 2px rgba(20,16,10,.06), 0 6px 18px rgba(20,16,10,.05);
  --r:18px;
}
body.dark{
  --bg:#0e0e10; --surface:#17171a; --surface2:#212125; --text:#f3f1ec; --muted:#9d9a92; --line:#2a2a2f;
  --accent:#f472b6; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-bottom:max(40px,env(safe-area-inset-bottom));transition:background .25s,color .25s}
button{font:inherit;color:inherit;cursor:pointer}
.cjk{font-family:"Noto Serif CJK SC","Noto Serif CJK JP","Noto Serif CJK KR","Songti SC","Hiragino Mincho ProN","Source Han Serif",serif}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.back:hover{color:var(--text)}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.brand .flag{font-size:1.4rem}
.brand .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
.icon-btn:hover{border-color:var(--accent)}

.wrap{max-width:980px;margin:0 auto;padding:16px}

/* ---------- Hero ---------- */
.hero{border-radius:24px;padding:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 17%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:color-mix(in srgb,var(--accent) 16%,var(--surface2));fill:none;stroke-width:10}
.ring .bar{stroke:var(--accent);fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.65rem;line-height:1}
.ring .pct small{display:block;font-size:.66rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.hero h1{margin:0;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1;letter-spacing:-.01em}
.hero .sub{margin:6px 0 14px;color:var(--muted);font-size:.95rem}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.stat b{color:var(--text);font-size:1rem;margin-right:3px}

.actions-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cta{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.cta:hover{transform:translateY(-1px);border-color:var(--accent)}
.cta.primary{background:var(--accent);color:#fff;border-color:transparent}

/* ---------- Search & filters ---------- */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:13px 44px 13px 44px;font:inherit;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.55;pointer-events:none}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--surface2);width:28px;height:28px;border-radius:50%;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;margin-bottom:6px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:10px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- Chips ---------- */
.chips-block{margin:8px 0 6px}
.chips-label{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:12px 2px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:thin}
.chip{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 13px;font-weight:600;font-size:.9rem;white-space:nowrap;transition:all .15s}
.chip .em{font-size:1.1rem}
.chip small{color:var(--muted);font-weight:600;font-size:.74rem}
.chip:hover{border-color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.chip.active small{color:rgba(255,255,255,.85)}
.chip.complete::after{content:"🏅"}
body.searching .chip.active{background:var(--surface);color:var(--text);border-color:var(--line);box-shadow:none}
body.searching .chip.active small{color:var(--muted)}

/* ---------- Phase ---------- */
.phase{display:none;margin-top:10px}
.phase.show{display:block}
.phase-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 2px 4px;flex-wrap:wrap}
.phase-head h2{margin:0;font-size:1.35rem;letter-spacing:-.01em}
.phase-head .months{font-size:.78rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em}
.phase-focus{color:var(--muted);font-size:.94rem;margin:2px 2px 10px}
.pbar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:0 2px 12px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.pbar-l{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin:0 2px 5px}

details.habits{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:6px;overflow:hidden}
details.habits summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;font-size:.95rem}
details.habits summary::-webkit-details-marker{display:none}
details.habits .chev{transition:transform .2s;color:var(--muted)}
details.habits[open] .chev{transform:rotate(90deg)}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line)}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.task .tn{font-weight:600}
.task .tn.done{text-decoration:line-through;color:var(--muted)}
.task .tm{font-size:.82rem;color:var(--muted)}
.tag{background:var(--surface2);border-radius:8px;padding:1px 8px;margin-left:4px}
.milestone{margin:0;padding:13px 16px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--accent) 7%,var(--surface));font-size:.92rem}

.group{margin-top:18px}
.group-label{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px;display:flex;align-items:center;gap:10px}
.group-label::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.hero{padding:28px}.ring{width:140px;height:140px}}

/* ---------- Card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;box-shadow:var(--shadow);position:relative;transition:border-color .2s,background .2s,transform .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card .target{font-size:1.4rem;font-weight:650;line-height:1.25;word-break:break-word}
.card .roman{color:var(--accent);font-size:.92rem;font-weight:600;margin-top:1px}
.card .gloss{color:var(--muted);font-size:.93rem}
.card .btns{display:flex;gap:8px}
.rbtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface2);display:grid;place-items:center;font-size:1.1rem;transition:all .15s;padding:0}
.rbtn.play{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.rbtn:hover{transform:scale(1.06)}
.rbtn:active{transform:scale(.94)}
.rbtn.playing{background:var(--accent);color:#fff;animation:pulse 1s infinite}
.rbtn.listening{background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 35%,transparent)}50%{box-shadow:0 0 0 9px transparent}}
.foot{grid-column:1/-1;display:flex;align-items:center;gap:10px;min-height:20px;flex-wrap:wrap}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.f{background:var(--accent)}
.badge-ok{display:none;font-size:.74rem;font-weight:700;color:var(--ok)}
.card.mastered{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 5%,var(--surface))}
.card.mastered .dot.f{background:var(--ok)}
.card.mastered .badge-ok{display:inline}
.fb{font-size:.82rem;color:var(--muted);flex:1;min-width:0}
.fb.correct{color:var(--ok);font-weight:600}
.fb.incorrect{color:var(--bad)}
.fb a{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline}
.card.flash{animation:flash .65s}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .big{font-size:2rem}

.req{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.req .rk{font-size:1.2rem;width:26px;text-align:center;flex:none}
.req .rb{flex:1;min-width:0}
.req .rl{font-weight:600;font-size:.92rem}
.req.ok .rl{color:var(--ok)}
.req .rp{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;margin-top:6px}
.req .rp i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.req.ok .rp i{background:var(--ok)}
.req .rn{font-size:.8rem;color:var(--muted);font-weight:700;white-space:nowrap}
.hcount{margin-left:8px;font-size:.78rem;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));padding:2px 9px;border-radius:99px}
.milestone.ok{color:var(--ok);font-weight:600}
.tips{padding:12px 16px;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.tips-t{font-weight:700;margin-bottom:4px}
.tips ul{margin:0;padding-left:18px}
.tips li{margin:3px 0}
.btn.mini{padding:6px 12px;font-size:.8rem;border-radius:10px}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.55);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding:0}
.overlay.open{display:flex}
@media(min-width:720px){.overlay{align-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 20px max(24px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s ease}
@media(min-width:720px){.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h3{margin:0;font-size:1.2rem}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.row label{font-weight:700;font-size:.88rem}
select,input[type=range]{width:100%}
select{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font:inherit}
input[type=range]{accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 14px;font-weight:700}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.vstatus{font-size:.85rem;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.vstatus.ok{color:var(--ok)} .vstatus.warn{color:var(--bad)}

.qprog{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;margin:8px 0 16px}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qbig{text-align:center;padding:10px 0 4px}
.qbig .t{font-size:2rem;font-weight:700;line-height:1.2}
.qbig .r{color:var(--accent);font-weight:600;margin-top:4px}
.qopt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin-top:9px;font-weight:600;transition:all .15s}
.qopt:hover{border-color:var(--accent)}
.qopt.correct{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:var(--ok)}
.qopt.wrong{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:var(--bad)}
.score{font-size:3rem;font-weight:800;text-align:center;color:var(--accent);margin:8px 0}

.flip{perspective:900px;margin:12px 0}
.flip-in{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:var(--surface2)}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface))}
.face .t{font-size:2rem;font-weight:700;line-height:1.2;word-break:break-word}
.face .r{color:var(--accent);font-weight:600}
.face .hint{font-size:.8rem;color:var(--muted)}
.fc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:all .3s;z-index:90;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot-note{margin:34px 4px 0;text-align:center;color:var(--muted);font-size:.82rem}

@media(max-width:430px){
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .stats{justify-content:center}
  .brand .nm{font-size:.95rem}
  .back span{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="back" href="index.html" aria-label="Volver a idiomas">←<span> Idiomas</span></a>
    <div class="brand"><span class="flag" id="brandFlag"></span><span class="nm" id="brandName"></span></div>
    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Cambiar tema">🌙</button>
    <button class="icon-btn" onclick="openSettings()" aria-label="Ajustes de voz">⚙️</button>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="ring">
      <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="bar" id="ringBar" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
      <div class="pct"><div><span id="ringPct">0</span>%<small>progreso</small></div></div>
    </div>
    <div>
      <h1 id="heroTitle"></h1>
      <p class="sub" id="heroSub"></p>
      <div class="stats">
        <div class="stat"><b id="stMastered">0</b>dominadas</div>
        <div class="stat"><b id="stStreak">0</b>🔥 racha</div>
        <div class="stat"><b id="stTasks">0</b>metas</div>
      </div>
    </div>
  </section>

  <div class="actions-row">
    <button class="cta primary" onclick="startQuiz()">🎲 Examen sorpresa</button>
    <button class="cta" onclick="startFlash()">🃏 Tarjetas de repaso</button>
  </div>

  <div class="search">
    <span class="ic">🔍</span>
    <input id="searchBox" type="search" inputmode="search" autocomplete="off" placeholder="Buscar palabra o frase en todo el vocabulario…" aria-label="Buscar">
    <button class="clr" id="searchClr" hidden aria-label="Borrar búsqueda">✕</button>
  </div>

  <div class="seg" id="seg" role="tablist" aria-label="Filtro">
    <button class="on" data-f="all">Todas</button>
    <button data-f="todo">Por aprender</button>
    <button data-f="done">Dominadas</button>
  </div>

  <div class="chips-block">
    <div class="chips-label">Plan de 12 meses</div>
    <div class="chips" id="chipsPlan"></div>
    <div class="chips-label">Vocabulario por tema</div>
    <div class="chips" id="chipsTopics"></div>
  </div>

  <div id="phasesContainer"></div>

  <p class="foot-note" id="footNote"></p>
</main>

<!-- Settings -->
<div class="overlay" id="settingsOv" onclick="if(event.target===this)closeOverlays()">
  <div class="sheet">
    <div class="sheet-head"><h3>⚙️ Voz y ajustes</h3><button class="x" onclick="closeOverlays()" aria-label="Cerrar">✕</button></div>
    <div class="vstatus" id="voiceStatus">Comprobando voces disponibles…</div>
    <div class="row" id="voicePickerRow" hidden>
      <label for="voicePicker">Voz para escuchar</label>
      <select id="voicePicker" onchange="onVoicePicked(this.value)"></select>
    </div>
    <div class="row">
      <label for="rateSlider">Velocidad: <span id="rateVal">0.85</span>×</label>
      <input type="range" id="rateSlider" min="0.5" max="1.1" step="0.05" value="0.85">
    </div>
    <div class="btn-row">
      <button class="btn" onclick="testVoice()">🔊 Probar sonido</button>
      <button class="btn danger" onclick="resetProgress()">Reiniciar progreso</button>
    </div>
    <p class="muted" style="margin-top:16px">Tu progreso se guarda en este navegador. El micrófono necesita https:// (GitHub Pages o Netlify funcionan).</p>
  </div>
</div>

<!-- Quiz / Flashcards -->
<div class="overlay" id="gameOv" onclick="if(event.target===this)closeOverlays()">
  <div class="sheet" id="gameBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const CFG = {"name": "Japonés", "nameLower": "japonés", "native": "日本語", "flag": "🇯🇵", "code": "ja-JP", "prefix": "ja", "storage": "japanese-plan", "cjk": true};

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}\p{M}]+/gu,' ').trim();}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fetchStore(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* ---------- state ---------- */
let state = {};
try{ state = JSON.parse(fetchStore(KEY) || '{}') || {}; }catch(e){ state = {}; }
function saveState(){ store(KEY, JSON.stringify(state)); }
// Old versions stored manual checkboxes (t-*). Habits are now computed from real activity, so drop them.
Object.keys(state).forEach(k => { if(k[0] === 't') delete state[k]; });
saveState();
let LOG = {days: {}, quiz: {}};   // real activity: correct pronunciations per day/phase, exam hits per phase
try{ const l = JSON.parse(fetchStore(K_LOG) || 'null'); if(l && l.days) LOG = {days: l.days, quiz: l.quiz || {}}; }catch(e){}
function saveLog(){ store(K_LOG, JSON.stringify(LOG)); }

const ITEMS = [];        // flat list of all vocabulary items
const PHASE_ITEMS = [];  // ids per phase
data.forEach((p, pi) => {
  PHASE_ITEMS[pi] = [];
  const add = (a, id, gi) => { if(!(id in state)) state[id] = 0; ITEMS.push({id, pi, gi, ...a}); PHASE_ITEMS[pi].push(id); };
  if(p.audioGroups) p.audioGroups.forEach((g, gi) => g.items.forEach((a, ai) => add(a, `a-${pi}-${gi}-${ai}`, gi)));
  else p.audio.forEach((a, ai) => add(a, `a-${pi}-${ai}`, 0));
});
const BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));

/* ---------- render ---------- */
let activePhase = Math.min(parseInt(fetchStore(K_PHASE) || '0', 10) || 0, data.length - 1);
let filterMode = 'all';

function cardHTML(it){
  const t = escapeHtml(it.hanzi);
  return `<article class="card" id="card-${it.id}" data-id="${it.id}" data-s="${escapeHtml(norm(it.hanzi + ' ' + it.pinyin + ' ' + it.es))}">
    <div>
      <div class="target ${CFG.cjk ? 'cjk' : ''}" lang="${CFG.code}">${it.hanzi}</div>
      <div class="roman">${it.pinyin}</div>
      <div class="gloss">${it.es}</div>
    </div>
    <div class="btns">
      <button class="rbtn play" data-text="${t}" aria-label="Escuchar" onclick="speak(this.dataset.text, this)">▶</button>
      <button class="rbtn mic" data-text="${t}" data-id="${it.id}" aria-label="Practicar pronunciación" onclick="startRecognition(this)">🎤</button>
    </div>
    <div class="foot"><div class="dots" id="dots-${it.id}"></div><span class="badge-ok">✓ Dominada</span><div class="fb" id="fb-${it.id}" role="status"></div></div>
  </article>`;
}

function buildAll(){
  const planBox = document.getElementById('chipsPlan'), topicBox = document.getElementById('chipsTopics');
  const container = document.getElementById('phasesContainer');
  data.forEach((p, pi) => {
    const chip = document.createElement('button');
    chip.className = 'chip'; chip.id = 'chip-' + pi;
    chip.innerHTML = `<span class="em">${EMOJI[pi] || '📘'}</span>${p.title}<small id="cc-${pi}"></small>`;
    chip.onclick = () => { clearSearch(); showPhase(pi, true); };
    (pi < PLAN_COUNT ? planBox : topicBox).appendChild(chip);

    let tips = '';
    p.tasks.forEach(t => { tips += `<li><b>${t.name}</b> <span class="tm">${t.time} · ${t.tool}</span></li>`; });

    let cards = '';
    if(p.audioGroups){
      p.audioGroups.forEach((g, gi) => {
        cards += `<div class="group"><div class="group-label">${g.label}</div><div class="grid">`;
        g.items.forEach((a, ai) => { cards += cardHTML(BY_ID[`a-${pi}-${gi}-${ai}`]); });
        cards += `</div></div>`;
      });
    } else {
      cards += `<div class="group"><div class="grid">`;
      p.audio.forEach((a, ai) => { cards += cardHTML(BY_ID[`a-${pi}-${ai}`]); });
      cards += `</div></div>`;
    }

    const sec = document.createElement('section');
    sec.className = 'phase'; sec.id = 'phase-' + pi;
    sec.innerHTML = `
      <div class="phase-head"><h2>${EMOJI[pi] || ''} ${p.title}</h2><span class="months">${p.months}</span><button class="btn mini" onclick="startQuiz(${pi})">🎲 Examen de esta etapa</button></div>
      <div class="phase-focus">${p.focus}</div>
      <div class="pbar-l"><span id="pl-${pi}"></span><span id="pp-${pi}"></span></div>
      <div class="pbar"><i id="pb-${pi}" style="width:0"></i></div>
      <details class="habits" id="habits-${pi}"><summary><span>🎯 Metas y hábitos <span class="hcount" id="hc-${pi}"></span></span><span class="chev">▸</span></summary>
        <div id="reqs-${pi}"></div>
        <p class="milestone" id="ms-${pi}"><b>Meta final —</b> ${p.milestone}</p>
        <div class="tips"><div class="tips-t">💡 Consejos fuera de la app (no cuentan para el progreso)</div><ul>${tips}</ul></div></details>
      <div class="phase-cards">${cards}</div>
      <div class="empty" id="empty-${pi}" hidden><div class="big">🔎</div>No hay tarjetas con este filtro.</div>`;
    container.appendChild(sec);
  });
  ITEMS.forEach(it => renderDots(it.id));
}

function renderDots(id){
  const el = document.getElementById('dots-' + id); if(!el) return;
  const n = Math.min(state[id] || 0, MASTERY);
  let h = ''; for(let i = 0; i < MASTERY; i++) h += `<span class="dot ${i < n ? 'f' : ''}"></span>`;
  el.innerHTML = h;
  document.getElementById('card-' + id).classList.toggle('mastered', n >= MASTERY);
}

/* ---------- navigation & filters ---------- */
function showPhase(i, scroll){
  activePhase = i; store(K_PHASE, String(i));
  applyFilters();
  const chip = document.getElementById('chip-' + i);
  if(chip) chip.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  if(scroll){ const el = document.getElementById('phase-' + i); if(el) window.scrollTo({top: el.offsetTop - 130, behavior:'smooth'}); }
}

const searchBox = document.getElementById('searchBox'), searchClr = document.getElementById('searchClr');
searchBox.addEventListener('input', () => { searchClr.hidden = !searchBox.value; applyFilters(); });
searchClr.onclick = () => { clearSearch(); searchBox.focus(); };
function clearSearch(){ searchBox.value = ''; searchClr.hidden = true; applyFilters(); }
document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  filterMode = b.dataset.f;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  applyFilters();
});

function applyFilters(){
  const q = norm(searchBox.value);
  const searching = q.length > 0;
  document.body.classList.toggle('searching', searching);
  data.forEach((p, pi) => {
    const sec = document.getElementById('phase-' + pi);
    let vis = 0;
    sec.querySelectorAll('.group').forEach(g => {
      let gv = 0;
      g.querySelectorAll('.card').forEach(c => {
        const done = (state[c.dataset.id] || 0) >= MASTERY;
        const ok = (!searching || c.dataset.s.includes(q)) && (filterMode === 'all' || (filterMode === 'done' ? done : !done));
        c.hidden = !ok; if(ok) gv++;
      });
      g.hidden = gv === 0; vis += gv;
    });
    const shown = searching ? vis > 0 : pi === activePhase;
    sec.classList.toggle('show', shown);
    document.getElementById('empty-' + pi).hidden = !(shown && vis === 0 && !searching);
    sec.querySelector('.habits').hidden = searching;
  });
  if(searching && !data.some((p, pi) => document.getElementById('phase-' + pi).classList.contains('show'))){
    let e = document.getElementById('noResults');
    if(!e){ e = document.createElement('div'); e.id = 'noResults'; e.className = 'empty'; e.innerHTML = '<div class="big">🔎</div>Sin resultados. Prueba con otra palabra.'; document.getElementById('phasesContainer').appendChild(e); }
    e.hidden = false;
  } else { const e = document.getElementById('noResults'); if(e) e.hidden = true; }
  data.forEach((p, pi) => document.getElementById('chip-' + pi).classList.toggle('active', pi === activePhase));
}

/* ---------- progress ---------- */
function phaseStats(pi){
  const ids = PHASE_ITEMS[pi];
  const m = ids.filter(id => (state[id] || 0) >= MASTERY).length;
  return {m, n: ids.length};
}
function dayCounts(pi){
  const out = [];
  Object.keys(LOG.days).forEach(d => { const c = (LOG.days[d] || {})['p' + pi] || 0; if(c > 0) out.push(c); });
  return out;
}
// Habits and goals are measured from real activity (correct mic pronunciations and exam answers); nothing is ticked by hand.
function getReqs(pi){
  const n = PHASE_ITEMS[pi].length, m = phaseStats(pi).m, dc = dayCounts(pi);
  const burst = Math.min(10, n), needDays = pi < PLAN_COUNT ? 5 : 3;
  return [
    {id:'half',  icon:'📈', label:'Dominar la mitad de las frases', cur:m, target:Math.ceil(n / 2)},
    {id:'days',  icon:'📆', label:`Practicar con el micrófono en ${needDays} días distintos`, cur:dc.length, target:needDays},
    {id:'burst', icon:'⚡', label:`Pronunciar bien ${burst} frases en un mismo día`, cur:dc.length ? Math.max(...dc) : 0, target:burst},
    {id:'exam',  icon:'🎲', label:'Acertar 5 preguntas del examen de esta etapa', cur:LOG.quiz['p' + pi] || 0, target:5},
    {id:'goal',  icon:'🏁', label:'Meta final: dominar todas las frases', cur:m, target:n},
  ].map(r => { const done = r.cur >= r.target; return {...r, cur:Math.min(r.cur, r.target), done}; });
}
const reqSeen = new Set(); let reqInit = false;
function updateProgress(){
  const aKeys = Object.keys(state).filter(k => k[0] === 'a');
  const aUnits = aKeys.reduce((sum, k) => sum + Math.min(state[k], MASTERY) / MASTERY, 0);
  let reqTotal = 0, reqDone = 0; const fresh = [];
  data.forEach((p, pi) => {
    const s = phaseStats(pi), reqs = getReqs(pi), nDone = reqs.filter(r => r.done).length;
    reqTotal += reqs.length; reqDone += nDone;
    reqs.forEach(r => { const k = pi + ':' + r.id; if(r.done){ if(reqInit && !reqSeen.has(k)) fresh.push(r); reqSeen.add(k); } else reqSeen.delete(k); });
    document.getElementById('reqs-' + pi).innerHTML = reqs.map(r => {
      const pct = r.target ? Math.round(r.cur / r.target * 100) : 0;
      return `<div class="req ${r.done ? 'ok' : ''}"><span class="rk">${r.done ? '✅' : r.icon}</span><div class="rb"><div class="rl">${r.label}</div><div class="rp"><i style="width:${pct}%"></i></div></div><span class="rn">${r.cur}/${r.target}</span></div>`;
    }).join('');
    document.getElementById('hc-' + pi).textContent = nDone + '/' + reqs.length;
    document.getElementById('ms-' + pi).classList.toggle('ok', reqs[reqs.length - 1].done);
    document.getElementById('cc-' + pi).textContent = s.m + '/' + s.n;
    document.getElementById('chip-' + pi).classList.toggle('complete', nDone === reqs.length);
    const pc = s.n ? Math.round(s.m / s.n * 100) : 0;
    document.getElementById('pb-' + pi).style.width = pc + '%';
    document.getElementById('pl-' + pi).textContent = s.m + ' de ' + s.n + ' dominadas';
    document.getElementById('pp-' + pi).textContent = pc + '%';
  });
  const total = aKeys.length + reqTotal;
  const pct = total ? Math.round(((aUnits + reqDone) / total) * 100) : 0;
  document.getElementById('ringPct').textContent = pct;
  document.getElementById('ringBar').style.strokeDashoffset = (326.7 * (1 - pct / 100)).toFixed(1);
  document.getElementById('stMastered').textContent = aKeys.filter(k => state[k] >= MASTERY).length + '/' + aKeys.length;
  document.getElementById('stTasks').textContent = reqDone + '/' + reqTotal;
  reqInit = true;
  if(fresh.length) setTimeout(() => toast('🎯 Cumplido: ' + fresh[0].label), 1600);
}
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}
function registerPlay(id){
  const it = BY_ID[id];
  if(it){ const d = dayStr(0); LOG.days[d] = LOG.days[d] || {}; LOG.days[d]['p' + it.pi] = (LOG.days[d]['p' + it.pi] || 0) + 1; saveLog(); }
  const was = (state[id] || 0) >= MASTERY;
  state[id] = Math.min((state[id] || 0) + 1, MASTERY);
  saveState(); renderDots(id); updateProgress(); bumpStreak();
  if(!was && state[id] >= MASTERY){ celebrate(id); }
  if(filterMode !== 'all') setTimeout(applyFilters, 700);
}
function celebrate(id){
  const c = document.getElementById('card-' + id);
  if(c){ c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 700); }
  toast('¡Dominada! 🎉 ' + (BY_ID[id] ? BY_ID[id].hanzi : ''));
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175, 1568].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; o.type = 'sine';
      const t = ctx.currentTime + i * .09;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.15, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + .26);
    });
  }catch(e){}
}

/* ---------- theme & streak ---------- */
function toggleTheme(){
  const d = document.body.classList.toggle('dark');
  document.getElementById('themeToggle').textContent = d ? '☀️' : '🌙';
  store(K_THEME, d ? 'dark' : 'light');
}
function initTheme(){
  let s = fetchStore(K_THEME);
  if(s === null && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) s = 'dark';
  if(s === 'dark'){ document.body.classList.add('dark'); document.getElementById('themeToggle').textContent = '☀️'; }
}
let streak = {count: 0, lastDate: null};
try{ streak = JSON.parse(fetchStore(K_STREAK)) || streak; }catch(e){}
function dayStr(offset){ const d = new Date(Date.now() - (offset || 0) * 86400000); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function bumpStreak(){
  const today = dayStr(0);
  if(streak.lastDate !== today){
    streak.count = streak.lastDate === dayStr(1) ? streak.count + 1 : 1;
    streak.lastDate = today; store(K_STREAK, JSON.stringify(streak));
  }
  renderStreak();
}
function renderStreak(){
  const alive = streak.lastDate === dayStr(0) || streak.lastDate === dayStr(1);
  document.getElementById('stStreak').textContent = alive ? streak.count : 0;
}

/* ---------- voices & speech ---------- */
let voicesReady = false, voiceList = [];
function loadVoices(){
  return new Promise(res => {
    if(!('speechSynthesis' in window)){ res([]); return; }
    const v = speechSynthesis.getVoices(); if(v && v.length){ res(v); return; }
    let done = false;
    speechSynthesis.onvoiceschanged = () => { if(done) return; done = true; res(speechSynthesis.getVoices()); };
    setTimeout(() => { if(done) return; done = true; res(speechSynthesis.getVoices()); }, 1500);
  });
}
function langOf(v){ return (v.lang || '').replace('_', '-'); }
function matchVoices(list){
  const exact = list.filter(v => langOf(v).toLowerCase() === CFG.code.toLowerCase());
  const pref = list.filter(v => langOf(v).toLowerCase().startsWith(CFG.prefix) && !exact.includes(v));
  return exact.concat(pref);
}
async function ensureVoices(){
  if(voicesReady) return voiceList;
  voiceList = await loadVoices(); voicesReady = true;
  const m = matchVoices(voiceList), st = document.getElementById('voiceStatus');
  if(m.length){ st.textContent = `Voz en ${CFG.nameLower} detectada: ${m[0].name} (${m.length} disponible${m.length > 1 ? 's' : ''})`; st.className = 'vstatus ok'; }
  else { st.textContent = `No se encontró una voz en ${CFG.nameLower}. Elige una abajo o instala una: Android → Ajustes > Sistema > Idiomas > Síntesis de voz; iPhone → Ajustes > Accesibilidad > Contenido hablado > Voces.`; st.className = 'vstatus warn'; }
  populatePicker(m);
  return voiceList;
}
function populatePicker(m){
  const sel = document.getElementById('voicePicker'), row = document.getElementById('voicePickerRow');
  if(!voiceList.length) return;
  row.hidden = false; sel.innerHTML = '';
  voiceList.forEach((v, i) => { const o = document.createElement('option'); o.value = i; o.textContent = `${v.name} (${v.lang})`; sel.appendChild(o); });
  const saved = fetchStore(KEY + '-voice');
  let idx = 0;
  if(saved){ const k = voiceList.findIndex(v => v.name === saved); if(k >= 0) idx = k; }
  else if(m.length) idx = voiceList.indexOf(m[0]);
  sel.value = String(idx);
}
function onVoicePicked(i){ const v = voiceList[parseInt(i, 10)]; if(v) store(KEY + '-voice', v.name); }
function pickedVoice(){ const s = document.getElementById('voicePicker'); return (s && s.value !== '') ? voiceList[parseInt(s.value, 10)] || null : null; }
function chosenVoice(){ return pickedVoice() || matchVoices(voiceList)[0] || null; }
let rate = parseFloat(fetchStore(K_RATE)) || 0.85;
const rateSlider = document.getElementById('rateSlider');
rateSlider.value = rate; document.getElementById('rateVal').textContent = rate.toFixed(2);
rateSlider.oninput = () => { rate = parseFloat(rateSlider.value); document.getElementById('rateVal').textContent = rate.toFixed(2); store(K_RATE, String(rate)); };

const lastSpoken = {};
async function speak(text, btn){
  const now = Date.now();
  if(lastSpoken[text] && now - lastSpoken[text] < 700) return;
  lastSpoken[text] = now;
  document.querySelectorAll('.rbtn.playing').forEach(b => b.classList.remove('playing'));
  if(btn) btn.classList.add('playing');
  const stop = () => { if(btn) btn.classList.remove('playing'); };
  await ensureVoices();
  const v = chosenVoice();
  if(v){ say(text, v, stop); return; }
  const audio = new Audio('https://translate.googleapis.com/translate_tts?ie=UTF-8&q=' + encodeURIComponent(text) + '&tl=' + CFG.code + '&client=gtx');
  audio.onended = stop;
  audio.onerror = () => { stop(); toast('No hay voz disponible. Revisa ⚙️ Ajustes.'); };
  try{ await audio.play(); }catch(e){ stop(); toast('No hay voz disponible. Revisa ⚙️ Ajustes.'); }
}
function say(text, voice, done){
  if(!('speechSynthesis' in window)){ done(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice.lang || CFG.code; u.voice = voice; u.rate = rate; u.volume = 1;
  u.onend = done; u.onerror = done;
  speechSynthesis.resume();
  setTimeout(() => speechSynthesis.speak(u), 50);
}
function testVoice(){
  if(!('speechSynthesis' in window)){ toast('Este navegador no soporta voz.'); return; }
  const first = BY_ID[ITEMS[0].id];
  const v = chosenVoice();
  if(v) say(first.hanzi, v, () => {}); else toast('No hay voz instalada para este idioma.');
}

/* ---------- pronunciation check ---------- */
function cmp(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}\p{M}]+/gu, ''); }
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] : 1 + Math.min(prev[j], cur[j - 1], prev[j - 1]);
    prev = cur;
  }
  return prev[n];
}
function closeEnough(said, expected){
  const s = cmp(said), e = cmp(expected);
  if(!s) return false; if(s === e) return true;
  return lev(s, e) <= Math.max(1, Math.ceil(e.length * 0.25));
}
function setFb(id, msg, cls, html){
  const f = document.getElementById('fb-' + id); if(!f) return;
  if(html) f.innerHTML = msg; else f.textContent = msg;
  f.className = 'fb ' + (cls || '');
}
function startRecognition(btn){
  const id = btn.dataset.id, expected = btn.dataset.text;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!window.isSecureContext){ setFb(id, '⚠️ El micrófono necesita https:// (GitHub Pages o Netlify). Sin micrófono no se registra la práctica.', 'incorrect'); return; }
  if(!SR){ setFb(id, 'Este navegador no soporta reconocimiento de voz. Usa Chrome o Edge: la práctica solo cuenta hablando.', 'incorrect'); return; }
  const r = new SR();
  r.lang = CFG.code; r.maxAlternatives = 3; r.interimResults = false;
  btn.classList.add('listening'); setFb(id, '🎤 Escuchando… di la frase', '');
  r.onresult = e => {
    const alts = Array.from(e.results[0]).map(x => x.transcript);
    if(alts.some(a => closeEnough(a, expected))){ setFb(id, '✅ ¡Correcto! — ' + alts[0], 'correct'); registerPlay(id); }
    else setFb(id, '❌ Se entendió: “' + alts[0] + '” — intenta de nuevo', 'incorrect');
  };
  r.onerror = e => {
    btn.classList.remove('listening');
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed') setFb(id, 'Permite el micrófono para poder practicar.', 'incorrect');
    else if(e.error === 'no-speech') setFb(id, 'No se detectó voz — intenta de nuevo.', 'incorrect');
    else setFb(id, 'Error de reconocimiento: ' + e.error, 'incorrect');
  };
  r.onend = () => btn.classList.remove('listening');
  try{ r.start(); }catch(e){ btn.classList.remove('listening'); }
}

/* ---------- overlays ---------- */
function closeOverlays(){ document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); quiz = null; flash = null; }
function openSettings(){ document.getElementById('settingsOv').classList.add('open'); ensureVoices(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeOverlays(); });

/* ---------- quiz ---------- */
let quiz = null;
function shuffle(a){ return [...a].sort(() => Math.random() - 0.5); }
function startQuiz(pi){
  const phaseOnly = typeof pi === 'number';
  const scope = phaseOnly ? ITEMS.filter(i => i.pi === pi) : ITEMS;
  const practiced = scope.filter(i => (state[i.id] || 0) > 0);
  const pool = practiced.length >= 8 ? practiced : scope;
  quiz = {items: shuffle(pool).slice(0, 8), i: 0, score: 0, pi: phaseOnly ? pi : null};
  document.getElementById('gameOv').classList.add('open'); quizQ();
}
function quizQ(){
  const box = document.getElementById('gameBox'), q = quiz.items[quiz.i];
  const wrong = shuffle(ITEMS.filter(x => x.es !== q.es)).slice(0, 3).map(x => x.es);
  const opts = shuffle([q.es, ...wrong]);
  box.innerHTML = `
    <div class="sheet-head"><h3>🎲 Examen sorpresa</h3><button class="x" onclick="closeOverlays()" aria-label="Cerrar">✕</button></div>
    <div class="muted">Pregunta ${quiz.i + 1} de ${quiz.items.length} · ${quiz.score} correctas</div>
    <div class="qprog"><i style="width:${(quiz.i / quiz.items.length) * 100}%"></i></div>
    <div class="qbig"><div class="t ${CFG.cjk ? 'cjk' : ''}">${q.hanzi}</div><div class="r">${q.pinyin}</div>
      <button class="btn" style="margin-top:10px" data-text="${escapeHtml(q.hanzi)}" onclick="speak(this.dataset.text, this)">▶ Escuchar</button></div>
    ${opts.map(o => `<button class="qopt" data-o="${escapeHtml(o)}" onclick="quizA(this)">${o}</button>`).join('')}`;
  speak(q.hanzi, null);
}
function quizA(btn){
  const all = btn.parentElement.querySelectorAll('.qopt'), right = quiz.items[quiz.i].es;
  all.forEach(o => { o.onclick = null; if(o.dataset.o === right) o.classList.add('correct'); });
  if(btn.dataset.o === right){
    quiz.score++;
    const qi = quiz.items[quiz.i]; LOG.quiz['p' + qi.pi] = (LOG.quiz['p' + qi.pi] || 0) + 1; saveLog(); updateProgress();
  } else btn.classList.add('wrong');
  setTimeout(() => { if(!quiz) return; quiz.i++; quiz.i >= quiz.items.length ? quizEnd() : quizQ(); }, 900);
}
function quizEnd(){
  const pct = Math.round(quiz.score / quiz.items.length * 100);
  document.getElementById('gameBox').innerHTML = `
    <div class="sheet-head"><h3>Resultado</h3><button class="x" onclick="closeOverlays()" aria-label="Cerrar">✕</button></div>
    <div class="score">${quiz.score}/${quiz.items.length}</div>
    <p style="text-align:center">${pct >= 80 ? '¡Excelente memoria! 🎉' : pct >= 50 ? 'Bien, sigue practicando 💪' : 'Repasa un poco más 📚'}</p>
    <div class="btn-row" style="justify-content:center"><button class="btn accent" onclick="startQuiz(${quiz.pi === null ? '' : quiz.pi})">Otra ronda 🎲</button><button class="btn" onclick="closeOverlays()">Cerrar</button></div>`;
}

/* ---------- flashcards ---------- */
let flash = null;
function startFlash(){
  const ids = PHASE_ITEMS[activePhase];
  let pool = ids.filter(id => (state[id] || 0) < MASTERY);
  if(pool.length < 4) pool = ids;
  flash = {deck: shuffle(pool).slice(0, 12).map(id => BY_ID[id]), i: 0, known: 0, missed: []};
  document.getElementById('gameOv').classList.add('open'); flashCard();
}
function flashCard(){
  const c = flash.deck[flash.i];
  document.getElementById('gameBox').innerHTML = `
    <div class="sheet-head"><h3>🃏 ${data[activePhase].title}</h3><button class="x" onclick="closeOverlays()" aria-label="Cerrar">✕</button></div>
    <div class="muted">Tarjeta ${flash.i + 1} de ${flash.deck.length}</div>
    <div class="qprog"><i style="width:${(flash.i / flash.deck.length) * 100}%"></i></div>
    <div class="flip" id="flip" onclick="this.classList.toggle('on'); if(this.classList.contains('on')) speak(flash.deck[flash.i].hanzi, null)">
      <div class="flip-in">
        <div class="face"><div class="t">${c.es}</div><div class="hint">Piensa cómo se dice… toca para ver</div></div>
        <div class="face back"><div class="t ${CFG.cjk ? 'cjk' : ''}">${c.hanzi}</div><div class="r">${c.pinyin}</div><div class="hint">${c.es}</div></div>
      </div>
    </div>
    <div class="btn-row" style="justify-content:center;margin-bottom:12px"><button class="btn" data-text="${escapeHtml(c.hanzi)}" onclick="speak(this.dataset.text, this)">▶ Escuchar</button></div>
    <div class="fc-btns"><button class="btn" onclick="flashNext(false)">🔁 Otra vez</button><button class="btn accent" onclick="flashNext(true)">✓ Lo sé</button></div>`;
}
function flashNext(ok){
  const c = flash.deck[flash.i]; if(ok) flash.known++; else flash.missed.push(c);
  flash.i++;
  if(flash.i < flash.deck.length) return flashCard();
  document.getElementById('gameBox').innerHTML = `
    <div class="sheet-head"><h3>Repaso terminado</h3><button class="x" onclick="closeOverlays()" aria-label="Cerrar">✕</button></div>
    <div class="score">${flash.known}/${flash.deck.length}</div>
    <p style="text-align:center">${flash.missed.length ? 'Te quedan ' + flash.missed.length + ' para repasar.' : '¡Las sabías todas! 🎉'}</p>
    <div class="btn-row" style="justify-content:center">
      ${flash.missed.length ? '<button class="btn accent" onclick="flashRetry()">Repasar las que fallé</button>' : ''}
      <button class="btn" onclick="startFlash()">Nuevo mazo</button></div>`;
}
function flashRetry(){ flash = {deck: shuffle(flash.missed), i: 0, known: 0, missed: []}; flashCard(); }

function resetProgress(){
  if(!confirm('¿Reiniciar todo el progreso de este idioma?')) return;
  Object.keys(state).forEach(k => state[k] = 0);
  LOG = {days: {}, quiz: {}}; saveState(); saveLog();
  reqSeen.clear(); reqInit = false;
  ITEMS.forEach(it => renderDots(it.id));
  updateProgress(); applyFilters(); closeOverlays(); toast('Progreso reiniciado');
}

/* ---------- init ---------- */
document.getElementById('brandFlag').textContent = CFG.flag;
document.getElementById('brandName').textContent = CFG.name;
const heroT = document.getElementById('heroTitle'); heroT.textContent = CFG.native; if(CFG.cjk) heroT.classList.add('cjk');
document.getElementById('heroSub').textContent = `Método de un año para hablar ${CFG.nameLower} con fluidez · ${ITEMS.length} palabras y frases con audio`;
document.getElementById('footNote').textContent = `Tu progreso se guarda automáticamente en este navegador. El audio usa la voz en ${CFG.nameLower} de tu dispositivo (${CFG.code}).`;
buildAll(); initTheme(); updateProgress(); renderStreak(); applyFilters();
const startChip = document.getElementById('chip-' + activePhase); if(startChip) setTimeout(() => startChip.scrollIntoView({inline:'center', block:'nearest'}), 50);
ensureVoices();
</script>
</body>
